name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine base path
        id: base
        shell: bash
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          # GitHub Pages does not support SPA rewrites, so use hash routing there.
          VITE_ROUTER: hash
          VITE_BASE_PATH: ${{ steps.base.outputs.value }}
          # Publishable key: safe to expose in the browser bundle.
          VITE_SUPABASE_URL: https://dbuzljugpusakqktraxc.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_EmVr3IpIe5LX6_wk1-26NA_AbQypdzg
          # 식품안전나라 공공데이터 키. "sample"은 테스트용입니다.
          VITE_FOODSAFETY_API_KEY: sample

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
